<!doctype html>
<html lang="en">
  <head>
    <script>(function(){try{var p=JSON.parse(localStorage.getItem('cyberos:appearance:v1')||'null');var s=['neon','mono','graphite','synthwave','bloodline','terminal','amber'];if(!p||s.indexOf(p.scheme)<0||(p.mode!=='dark'&&p.mode!=='light'))p={scheme:'neon',mode:'dark'};document.documentElement.dataset.cyberScheme=p.scheme;document.documentElement.dataset.cyberMode=p.mode;document.documentElement.dataset.theme=p.mode;document.documentElement.style.colorScheme=p.mode}catch(e){document.documentElement.dataset.cyberScheme='neon';document.documentElement.dataset.cyberMode='dark';document.documentElement.dataset.theme='dark'}})();</script>
    <link rel="stylesheet" href="../shared/src/appearance.css" />
    <link rel="stylesheet" href="../ui/src/fonts.css" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CyberOS — a personal operating system for the cyber era." />
    <title>CyberOS</title>
    <script>
      (() => {
        const root = document.documentElement;
        let language = navigator.language?.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
        try {
          const storedLanguage = localStorage.getItem("cyberos:language");
          language = storedLanguage === "zh-CN"
            ? "zh-CN"
            : storedLanguage === "en"
              ? "en"
              : language;
        } catch {}
        root.lang = language;
      })();
    </script>
    <style>
      :root {
        --boot-bg: var(--cyber-bg);
        --boot-panel: var(--cyber-soft);
        --boot-line: var(--cyber-line);
        --boot-text: var(--cyber-ink);
        --boot-inverse: var(--cyber-ink);
        --boot-muted: var(--cyber-muted);
        --boot-muted-2: var(--cyber-muted);
        --boot-accent: var(--cyber-accent);
        --boot-info: var(--cyber-accent2);
        --boot-danger: var(--cyber-danger);
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--boot-bg);
      }

      #cyberos-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: var(--boot-text);
        background: var(--boot-bg);
        opacity: 1;
        transition: opacity 260ms cubic-bezier(.2, .72, .2, 1), visibility 260ms linear;
      }

      #cyberos-boot.is-exiting {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .cyberos-boot-shell {
        position: relative;
        display: grid;
        justify-items: stretch;
        width: min(560px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 30px 34px 26px;
        border: 2px solid var(--boot-line);
        color: var(--boot-inverse);
        background: var(--boot-panel);
        box-shadow: 8px 8px 0 var(--boot-accent);
        clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 22px 100%, 0 calc(100% - 22px));
        text-align: left;
        animation: cyberos-boot-arrive 320ms cubic-bezier(.2, .72, .2, 1) both;
      }

      .cyberos-boot-shell::before {
        position: absolute;
        top: 8px;
        right: 42px;
        width: 72px;
        height: 3px;
        background: var(--boot-info);
        content: "";
      }

      .cyberos-boot-brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--boot-inverse);
        font: 700 32px/1 var(--cyberos-font-ui);
        letter-spacing: 0;
      }

      .cyberos-boot-brand img {
        display: block;
        width: 195px;
        height: 40px;
      }

      .cyberos-boot-brand .cyberos-boot-logo-light { display: none; }
      html[data-cyber-mode="light"] .cyberos-boot-brand .cyberos-boot-logo-light { display: block; }
      html[data-cyber-mode="light"] .cyberos-boot-brand .cyberos-boot-logo-dark { display: none; }

      .cyberos-boot-copy {
        display: grid;
        gap: 6px;
        margin-top: 38px;
        padding-top: 14px;
        border-top: 1px solid var(--cyber-line);
      }

      .cyberos-boot-copy strong {
        color: var(--boot-inverse);
        font: 700 28px/1.05 var(--cyberos-font-ui);
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .cyberos-boot-copy span {
        color: var(--boot-info);
        font: 600 12px/1.5 var(--cyberos-font-ui);
        text-transform: uppercase;
      }

      .cyberos-boot-sequence {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        margin-top: 20px;
        background: var(--cyber-line);
      }

      .cyberos-boot-sequence span {
        padding: 7px 8px;
        color: var(--boot-inverse);
        background: var(--boot-panel);
        font: 600 10px/1.2 var(--cyberos-font-ui);
      }

      .cyberos-boot-sequence span::before {
        display: inline-block;
        width: 5px;
        height: 5px;
        margin-right: 6px;
        background: var(--boot-info);
        content: "";
      }

      .cyberos-boot-progress {
        width: 100%;
        height: 3px;
        margin-top: 24px;
        overflow: hidden;
        background: var(--cyber-line);
      }

      .cyberos-boot-progress span {
        display: block;
        width: 42%;
        height: 100%;
        background: var(--boot-info);
        animation: cyberos-boot-progress 1.35s ease-in-out infinite;
      }

      .cyberos-boot-footer {
        margin-top: 16px;
        color: var(--cyber-muted);
        font: 600 10px/1.4 var(--cyberos-font-ui);
        text-align: right;
        text-transform: uppercase;
      }

      #cyberos-boot[data-state="error"] .cyberos-boot-brand {
        color: var(--boot-danger);
      }

      #cyberos-boot[data-state="error"] .cyberos-boot-progress {
        display: none;
      }

      .cyberos-boot-retry {
        display: none;
        min-height: 38px;
        margin-top: 22px;
        padding: 0 16px;
        border: 1px solid var(--boot-accent);
        border-radius: 0;
        color: var(--cyber-on-accent);
        background: var(--boot-accent);
        cursor: pointer;
        font: 700 12px/1 var(--cyberos-font-ui);
        clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      }

      .cyberos-boot-retry:hover {
        border-color: var(--boot-accent);
        background: var(--boot-accent);
      }

      #cyberos-boot[data-state="error"] .cyberos-boot-retry,
      #cyberos-boot[data-state="slow"] .cyberos-boot-retry {
        display: inline-flex;
        align-items: center;
      }

      @keyframes cyberos-boot-arrive {
        from { opacity: 0; transform: translateY(8px) skewX(-1deg); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes cyberos-boot-progress {
        0% { transform: translateX(-120%); }
        60%, 100% { transform: translateX(245%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #cyberos-boot,
        .cyberos-boot-shell,
        .cyberos-boot-progress span {
          animation: none;
          transition: none;
        }
      }

      @media (max-width: 480px) {
        .cyberos-boot-shell {
          padding: 24px 20px 22px;
        }

        .cyberos-boot-sequence {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="cyberos-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="cyberos-boot-shell">
        <div class="cyberos-boot-brand">
          <img class="cyberos-boot-logo-dark" src="/cyberos-wordmark-white.svg" alt="CyberOS" width="195" height="40" />
          <img class="cyberos-boot-logo-light" src="/cyberos-wordmark.svg" alt="CyberOS" width="195" height="40" />
        </div>
        <div class="cyberos-boot-copy">
          <strong data-boot-title>Preparing workspace</strong>
          <span data-boot-detail>Connecting to local services</span>
        </div>
        <div class="cyberos-boot-sequence" aria-hidden="true">
          <span>SYS.01</span><span>NAS LINK</span><span>INDEX BUS</span>
        </div>
        <div class="cyberos-boot-progress" aria-hidden="true"><span></span></div>
        <div class="cyberos-boot-footer">
          <span data-boot-system>Local system</span>
        </div>
        <button class="cyberos-boot-retry" type="button" data-boot-retry>Reload</button>
      </div>
    </div>
    <script>
      (() => {
        const bootScreen = document.getElementById("cyberos-boot");
        if (!bootScreen) return;

        const bootTitle = bootScreen.querySelector("[data-boot-title]");
        const bootDetail = bootScreen.querySelector("[data-boot-detail]");
        const bootRetry = bootScreen.querySelector("[data-boot-retry]");
        const isChinese = document.documentElement.lang.toLowerCase().startsWith("zh");
        let ready = false;

        const showError = () => {
          if (ready) return;
          bootScreen.dataset.state = "error";
          bootScreen.setAttribute("aria-busy", "false");
          if (bootTitle) bootTitle.textContent = isChinese ? "CyberOS 启动失败" : "CyberOS could not start";
          if (bootDetail) bootDetail.textContent = isChinese ? "请重新加载页面后再试" : "Reload the page to try again";
        };

        const showSlowLoad = () => {
          if (ready || bootScreen.dataset.state === "error") return;
          bootScreen.dataset.state = "slow";
          if (bootDetail) bootDetail.textContent = isChinese
            ? "正在加载页面资源，请稍候"
            : "Still loading application resources";
        };

        const timeout = window.setTimeout(showSlowLoad, 15000);
        const handleError = () => showError();
        const handleReady = () => {
          ready = true;
          window.clearTimeout(timeout);
          window.removeEventListener("error", handleError, true);
          window.removeEventListener("unhandledrejection", handleError);
        };

        window.addEventListener("error", handleError, true);
        window.addEventListener("unhandledrejection", handleError);
        window.addEventListener("cyberos:ready", handleReady, { once: true });
        bootRetry?.addEventListener("click", () => {
          const url = new URL(window.location.href);
          url.searchParams.set("_cyberos_reload", Date.now().toString());
          window.location.replace(url.toString());
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
