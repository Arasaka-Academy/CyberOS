<!doctype html>
<html lang="zh-CN">
  <head>
    <script>(function(){try{var p=JSON.parse(localStorage.getItem('cyberos:appearance:v1')||'null');var s=['neon','mono','graphite','synthwave','bloodline','terminal','amber'];if(!p||s.indexOf(p.scheme)<0||(p.mode!=='dark'&&p.mode!=='light'))p={scheme:'neon',mode:'dark'};document.documentElement.dataset.cyberScheme=p.scheme;document.documentElement.dataset.cyberMode=p.mode;document.documentElement.dataset.theme=p.mode;document.documentElement.style.colorScheme=p.mode}catch(e){document.documentElement.dataset.cyberScheme='neon';document.documentElement.dataset.cyberMode='dark';document.documentElement.dataset.theme='dark'}})();</script>
    <link rel="stylesheet" href="../../shared/src/appearance.css" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cyberos-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>CyberOS TV</title>
    <style>
      html, body { margin: 0; min-width: 320px; min-height: 100%; background: var(--cyber-bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/tv/main.tsx"></script>
  </body>
</html>
