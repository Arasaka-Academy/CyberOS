# [INPUT]: systemd-tmpfiles 的系统启动及升级调用。
# [OUTPUT]: 运行目录与不可由服务用户替换的 TV 输出锁。
# [POS]: 固定目录权限；保留现存锁 inode 以覆盖服务重启。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
d /run/cyberos 0770 root cyberos -
f /run/cyberos-tv-output.lock 0644 root root -
d /run/mdadm 0755 root root -
d /run/samba 0755 root root -
